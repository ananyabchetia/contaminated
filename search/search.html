<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple HTML Page</title>
</head>

<style>
    #map {
        height: 400px;
        width: 700px;
        margin: 20px auto;
        max-width: 100%;
    }

    .controls {
        margin: 10px 0;
        height: 50px;
        font-size: 14px;
        padding: 0 16px;
        width: 250px;
        max-width: 90%;
        display: block;
        margin: 0 auto 10px auto;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        margin: 0;
        padding: 0;
    }

    .content {
        max-width: 700px;
        padding: 0 20px;
        box-sizing: border-box;
    }

    .container {
        width: 100%;
        max-width: 700px;
        padding: 0 10px;
        box-sizing: border-box;
    }

    p {
        margin: 10px 0;
    }

    .subhead_2 {
        font-weight: bold;
        font-size: 1.5rem;
    }

    .loading {
        color: #000000;
        font-style: italic;
    }

    #distanceResult {
        padding: 0 10px;
        max-width: 100%;
        box-sizing: border-box;
    }

    @media (max-width: 768px) {
        body {
            font-size: 1rem;
        }

        #map {
            height: 350px;
            width: 100%;
            margin: 15px 0;
        }

        .subhead_2 {
            font-size: 1.2rem;
        }

        .content {
            padding: 0 15px;
        }

        .controls {
            width: 100%;
            font-size: 16px;
            height: 45px;
        }
    }

    @media (max-width: 480px) {
        body {
            font-size: 0.9rem;
        }

        #map {
            height: 300px;
        }

        .subhead_2 {
            font-size: 1.1rem;
        }

        .controls {
            height: 40px;
            font-size: 14px;
        }
    }
</style>

<body>
    <div class="content">
        <p class="subhead_2">How far is your school or home from a current Superfund Site?</p>
        <p>Nationally, almost 1800 public schools are within a mile away from a contaminated site on the Superfund's NPL
            list.</p>
    </div>
    <div class="container">
        <input id="searchInput" class="controls" type="text" placeholder="Enter location">
        <div id="map"></div>

        <!-- Display -->
        <div id="distanceResult" class="loading">Loading Superfund data...</div>
    </div>
    <!--Google Maps Javascript API-->
    <script
        src="https://maps.googleapis.com/maps/api/js?libraries=places,geometry&key=AIzaSyA7EFIyn5sZVdaYEq7jY5tCRQIuNZZOcBA&callback=initMap"
        async defer>
        </script>
    <script>
        let map;
        let dataLoaded = false;
        let currentUserLocation = null;
        function initMap() {
            var map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 39.5, lng: -98.35 },
                zoom: 4
            });

            map.data.loadGeoJson('../superfund_sites_dataset/geojson/Superfund_National_Priorities_List_(NPL)_Sites_with_Status_Information.geojson');

            // Load GeoJSON data with proper error handling
            map.data.loadGeoJson('../superfund_sites_dataset/geojson/Superfund_National_Priorities_List_(NPL)_Sites_with_Status_Information.geojson', {}, function () {
                dataLoaded = true;
                document.getElementById('distanceResult').innerText = "Superfund data loaded. Enter your school address, workplace or a location to find the distance.";
                document.getElementById('distanceResult').className = "";

                // Add click listener for Superfund sites
                var infoWindow = new google.maps.InfoWindow();
                map.data.addListener('click', function (event) {
                    var siteName = event.feature.getProperty('Site_Name') || 'Unknown Site';
                    var siteCity = event.feature.getProperty('City') || '';
                    var siteState = event.feature.getProperty('State') || '';

                    var content = '<div>Superfund site name: <strong>' + siteName + '</strong>';
                    if (siteCity || siteState) {
                        content += '<br>' + siteCity + (siteCity && siteState ? ', ' : '') + siteState;
                    }
                    content += '</div>';

                    infoWindow.setContent(content);
                    infoWindow.setPosition(event.latLng);
                    infoWindow.open(map);
                });

                // User location marker
                userMarker.setIcon({
                    url: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png',
                    scaledSize: new google.maps.Size(40, 40)
                });
                userMarker.setPosition(place.geometry.location);
                userMarker.setVisible(true);

                // Add click listener for user marker
                userMarker.addListener('click', function () {
                    userInfoWindow.setContent('<div><strong>Your Location</strong><br>' + place.formatted_address + '</div>');
                    userInfoWindow.open(map, userMarker);
                });

                // If user already entered a location, calculate distance now
                if (currentUserLocation) {
                    calculateDistance(currentUserLocation);
                }
            });
            var input = document.getElementById('searchInput');
            var autocomplete = new google.maps.places.Autocomplete(input);
            autocomplete.bindTo('bounds', map);

            var infowindow = new google.maps.InfoWindow();
            var marker = new google.maps.Marker({
                map: map,
                anchorPoint: new google.maps.Point(0, -29)
            });

            autocomplete.addListener('place_changed', function () {
                infowindow.close();
                marker.setVisible(false);
                var place = autocomplete.getPlace();
                if (!place.geometry) {
                    window.alert("Autocomplete's returned place contains no geometry");
                    return;
                }

                // Center map
                if (place.geometry.viewport) {
                    map.fitBounds(place.geometry.viewport);
                } else {
                    map.setCenter(place.geometry.location);
                    map.setZoom(17);
                }

                // Marker
                marker.setIcon({
                    url: place.icon,
                    size: new google.maps.Size(71, 71),
                    origin: new google.maps.Point(0, 0),
                    anchor: new google.maps.Point(17, 34),
                    scaledSize: new google.maps.Size(35, 35)
                });
                marker.setPosition(place.geometry.location);
                marker.setVisible(true);

                // Address info
                var address = '';
                if (place.address_components) {
                    address = [
                        (place.address_components[0] && place.address_components[0].short_name || ''),
                        (place.address_components[1] && place.address_components[1].short_name || ''),
                        (place.address_components[2] && place.address_components[2].short_name || '')
                    ].join(' ');
                }

                infowindow.setContent('<div><strong>' + place.name + '</strong><br>' + address);
                infowindow.open(map, marker);

                // --- DISTANCE CALCULATION ---
                var userLatLng = place.geometry.location;
                var minDistanceMeters = Infinity;
                var nearestSite = null; // Add this to store the nearest site feature

                map.data.forEach(function (feature) {
                    var geometry = feature.getGeometry();
                    if (geometry.getType() === 'Point') {
                        var coords = geometry.get();
                        var siteLatLng = new google.maps.LatLng(coords.lat(), coords.lng());
                        var distance = google.maps.geometry.spherical.computeDistanceBetween(userLatLng, siteLatLng);
                        if (distance < minDistanceMeters) {
                            minDistanceMeters = distance;
                            nearestSite = feature;
                        }
                    }
                });

                var miles = (minDistanceMeters * 0.000621371).toFixed(2);
                var siteName = nearestSite ? nearestSite.getProperty('Site_Name') : 'Unknown Site';

                document.getElementById('distanceResult').innerHTML =
                    "<p>The nearest Superfund site is called <strong>" + siteName + "</strong> and it is <strong>" + miles + "</strong> miles away from you.</p>" +
                    "<p>For more information on Superfund sites near you, visit <a href='https://www.epa.gov/superfund/superfund-national-priorities-list-npl' target='_blank'>EPA's website</a>.</p>";

            });
        }
    </script>
</body>

</html>
